name: publish

# Publishes the `a5` crate to crates.io when a version tag (vX.Y.Z, vX.Y.Z-beta.N, ...) is pushed.
# Uses crates.io trusted publishing (OIDC) — no CARGO_REGISTRY_TOKEN secret. Configure the
# trusted publisher for the `a5` crate on crates.io to trust this repo (felixpalmer/a5-rs)
# + workflow (publish.yml).
#
# Local release flow:
#   1. bump "version" in Cargo.toml (e.g. 0.10.1 or 1.0.0-beta.1)
#   2. update CHANGELOG.md
#   3. commit, then `./publish.sh beta` (prerelease, from main) or
#      `./publish.sh prod` (stable, from a *-release branch) — tags v<version>
#      and pushes, which triggers this workflow.
#
# crates.io needs no dist-tag: cargo auto-excludes prerelease versions from default resolution.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for crates.io trusted publishing (OIDC)

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Build
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked

      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
